name: StegTalk Cross-Edge Resolution

on:
  push:
    branches: ["main"]
    paths:
      - "src/stegtalk/cross_edge_resolver.py"
      - "src/stegtalk/physical_edge_runtime.py"
      - "runtime/cross-edge-physical-runtime.v1.json"
      - "schemas/cross-edge-capability.schema.json"
      - "tests/test_cross_edge_resolver.py"
      - "tests/test_physical_edge_runtime.py"
      - ".github/workflows/cross-edge-resolution.yml"
      - "STEGTALK_TASK_QUEUE.json"
      - "STEGTALK_MIRROR_HANDOFF.md"
  pull_request:
    paths:
      - "src/stegtalk/cross_edge_resolver.py"
      - "src/stegtalk/physical_edge_runtime.py"
      - "runtime/cross-edge-physical-runtime.v1.json"
      - "schemas/cross-edge-capability.schema.json"
      - "tests/test_cross_edge_resolver.py"
      - "tests/test_physical_edge_runtime.py"
      - ".github/workflows/cross-edge-resolution.yml"

permissions:
  contents: read

jobs:
  validate-cross-edge-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile resolver and runtime harness
        run: python -m py_compile src/stegtalk/cross_edge_resolver.py src/stegtalk/physical_edge_runtime.py tests/test_cross_edge_resolver.py tests/test_physical_edge_runtime.py
      - name: Run resolver and runtime tests
        run: python -m unittest tests.test_cross_edge_resolver tests.test_physical_edge_runtime -v
